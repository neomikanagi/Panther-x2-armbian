name: Panther X2 bootchain compatibility candidate

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish as a prerelease (NOT hardware-validated)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: panther-x2-bootchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Test image safety and byte-preservation guards
        run: |
          python3 -m unittest discover -s tests -v
          bash -n scripts/build_bootchain_candidate.sh
      - name: Build from checksum-pinned upstream inputs
        run: bash scripts/build_bootchain_candidate.sh
      - name: Upload offline-validated candidate
        uses: actions/upload-artifact@v4
        with:
          name: Panther-X2-BSP61-ophub-bootchain-candidate
          path: out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish candidate prerelease
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "bootchain-candidate-${GITHUB_RUN_NUMBER}" out/* \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --prerelease \
            --title "Panther X2 BSP 6.1 + ophub bootchain: TEST CANDIDATE" \
            --notes 'Boot-gap replacement only. SHA-256 pinned inputs; original GPT, BSP kernel, DTB, modules and root filesystem are byte-for-byte preserved. NOT hardware boot-tested; NOT NPU/VPU runtime-tested. Test using a spare TF card first; do not overwrite eMMC. See README and bootchain-validation.json.'
